services:
  nzb-proxy:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      NZB_PROXY_UPSTREAM_URL: ${NZB_PROXY_UPSTREAM_URL:-http://prowlarr:9696}
      NZB_PROXY_PUBLIC_URL: ${NZB_PROXY_PUBLIC_URL:-http://nzb-proxy:8080}
      NZB_PROXY_API_KEY: ${NZB_PROXY_API_KEY:?Set your Prowlarr API key in .env}
      NZB_PROXY_ALLOWED_HOSTS: ${NZB_PROXY_ALLOWED_HOSTS:-api.nzb.life,api.nzbgeek.info,nzbfinder.ws}
      NZB_PROXY_CACHE_TTL: ${NZB_PROXY_CACHE_TTL:-168h}
    volumes:
      - cache:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Attach this service to the network shared by Prowlarr and Radarr/Sonarr.
volumes:
  cache:
