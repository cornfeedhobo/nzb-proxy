name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - name: Check CLI version without service configuration
        shell: bash
        run: |
          go build -o "$RUNNER_TEMP/nzb-proxy" ./cmd/nzb-proxy
          test "$("$RUNNER_TEMP/nzb-proxy" --version)" = 'nzb-proxy dev (commit unknown)'
          go build -ldflags="-X main.version=0.1.0 -X main.commit=$GITHUB_SHA" -o "$RUNNER_TEMP/nzb-proxy" ./cmd/nzb-proxy
          test "$("$RUNNER_TEMP/nzb-proxy" --version)" = "nzb-proxy 0.1.0 (commit $GITHUB_SHA)"
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 tests/integration/run.py
  publish:
    needs: [test, integration]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Determine image tags and binary version
        id: release
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$GITHUB_REF" == 'refs/heads/main' ]]; then
            version=dev
            tags="${image}:latest,${image}:sha-${GITHUB_SHA}"
          elif [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            version="${GITHUB_REF_NAME#v}"
            tags="${image}:${version}"
          else
            echo 'Release tags must have the form vMAJOR.MINOR.PATCH (for example v0.1.0).' >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            REVISION=${{ github.sha }}
          tags: ${{ steps.release.outputs.tags }}
          labels: |
            org.opencontainers.image.title=nzb-proxy
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
