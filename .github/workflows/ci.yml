name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - name: Check CLI version without service configuration
        shell: bash
        run: |
          go build -o "$RUNNER_TEMP/nzb-proxy" ./cmd/nzb-proxy
          test "$("$RUNNER_TEMP/nzb-proxy" --version)" = 'nzb-proxy dev (commit unknown)'
          go build -ldflags="-X main.version=0.1.0 -X main.commit=$GITHUB_SHA" -o "$RUNNER_TEMP/nzb-proxy" ./cmd/nzb-proxy
          test "$("$RUNNER_TEMP/nzb-proxy" --version)" = "nzb-proxy 0.1.0 (commit $GITHUB_SHA)"
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/integration/run.py
  publish:
    needs: [test, integration]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Read release version from Git tag
        id: release
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Release tags must have the form vMAJOR.MINOR.PATCH (for example v0.1.0).' >&2
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            REVISION=${{ github.sha }}
          tags: |
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
            ${{ steps.release.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=nzb-proxy
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
